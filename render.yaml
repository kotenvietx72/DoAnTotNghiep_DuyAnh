# Free demo: no paid disks or databases are provisioned.
# Local SQLite changes are lost when Render restarts or redeploys the service.
services:
  - type: web
    name: epu-energy
    runtime: python
    plan: free
    region: singapore
    branch: main
    rootDir: duy anh
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --worker-class gthread --workers 1 --threads 20 --bind 0.0.0.0:$PORT app:app
    autoDeployTrigger: commit
    healthCheckPath: /api/state
    numInstances: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: PYTHON_DOTENV_DISABLED
        value: "1"
      - key: TELEGRAM_ENABLED
        value: "0"
      - key: ROOM_DATABASE
        value: data/rooms.sqlite3

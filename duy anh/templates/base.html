<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17675b">
  <meta name="description" content="Giám sát phụ tải điện theo thiết bị cho phòng học, kí túc xá và phòng bảo vệ.">
  <title>{{ title }} · EPU Energy</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  <script defer src="{{ url_for('static', filename='vendor/chart.umd.js') }}"></script>
  <script defer src="{{ url_for('static', filename='vendor/socket.io.min.js') }}"></script>
  <script defer src="{{ url_for('static', filename='vendor/html2pdf.bundle.min.js') }}"></script>
  <script defer src="{{ url_for('static', filename='js/room-model.js') }}"></script>
  <script defer src="{{ url_for('static', filename='js/app.js') }}"></script>
</head>
<body data-page="{{ page }}" {% if room_id is defined %}data-room="{{ room_id }}"{% endif %}>
  <a class="skip-link" href="#main">Đến nội dung chính</a>
  <svg class="svg-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="icon-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
    <symbol id="icon-school" viewBox="0 0 24 24"><path d="m3 9 9-6 9 6M5 9v12h14V9M9 21v-6h6v6M9 10h.01M15 10h.01"/></symbol>
    <symbol id="icon-bed" viewBox="0 0 24 24"><path d="M3 18V5m18 13V9H3m0 5h18M3 21v-3h18v3M7 9V6h6v3"/></symbol>
    <symbol id="icon-shield" viewBox="0 0 24 24"><path d="m12 3 8 3v6c0 4-4 7-8 9-4-2-8-5-8-9V6l8-3Z"/><path d="m8 12 3 3 5-6"/></symbol>
    <symbol id="icon-settings" viewBox="0 0 24 24"><path d="m9 3-.7 3-2 .9-2.7-.8-2 3.5 2.2 2.1v2.3l-2.2 2.1 2 3.5 2.7-.8 2 .9.7 3h4l.7-3 2-.9 2.7.8 2-3.5-2.2-2.1v-2.3l2.2-2.1-2-3.5-2.7.8-2-.9-.7-3Z"/><circle cx="11" cy="12" r="3"/></symbol>
    <symbol id="icon-chart" viewBox="0 0 24 24"><path d="M4 3v18h17M7 15l4-5 4 3 5-8"/></symbol>
    <symbol id="icon-bolt" viewBox="0 0 24 24"><path d="m14 2-10 12h7l-1 8 10-12h-7l1-8Z"/></symbol>
    <symbol id="icon-arrow" viewBox="0 0 24 24"><path d="M4 12h16m-6-6 6 6-6 6"/></symbol>
    <symbol id="icon-download" viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5"/></symbol>
    <symbol id="icon-plug" viewBox="0 0 24 24"><path d="M8 3v5m8-5v5M6 8h12v4a6 6 0 0 1-12 0V8Zm6 10v4"/></symbol>
  </svg>
  <aside class="sidebar">
    <a class="brand" href="/" aria-label="EPU Energy - Trang tổng quan"><span class="brand-mark"><svg><use href="#icon-bolt"/></svg></span><span>EPU<span class="brand-light"> Energy</span></span></a>
    <nav class="main-nav" aria-label="Điều hướng chính">
      <a href="/" class="nav-item {{ 'active' if page == 'dashboard' }}" {% if page == 'dashboard' %}aria-current="page"{% endif %}><svg><use href="#icon-grid"/></svg>Tổng quan</a>
      <a href="/rooms/r1" class="nav-item {{ 'active' if page == 'r1' }}" {% if page == 'r1' %}aria-current="page"{% endif %}><svg><use href="#icon-school"/></svg>Chi tiết phòng học</a>
      <a href="/rooms/r2" class="nav-item {{ 'active' if page == 'r2' }}" {% if page == 'r2' %}aria-current="page"{% endif %}><svg><use href="#icon-bed"/></svg>Chi tiết phòng kí túc xá</a>
      <a href="/rooms/r3" class="nav-item {{ 'active' if page == 'r3' }}" {% if page == 'r3' %}aria-current="page"{% endif %}><svg><use href="#icon-shield"/></svg>Chi tiết phòng bảo vệ</a>
      <div class="nav-divider"></div>
      <a href="/internal" class="nav-item {{ 'active' if page == 'internal' }}" {% if page == 'internal' %}aria-current="page"{% endif %}><svg><use href="#icon-chart"/></svg>Phân tích nội bộ</a>
      <a href="/settings" class="nav-item {{ 'active' if page == 'settings' }}" {% if page == 'settings' %}aria-current="page"{% endif %}><svg><use href="#icon-settings"/></svg>Cài đặt</a>
    </nav>
  </aside>
  <div class="app-shell">
    <header class="topbar"><div class="topbar-right"><span id="connectionStatus" class="connection"><span class="online-dot"></span>Đang kết nối</span><span id="todayDate" class="today-date"></span></div></header>
    <main id="main" class="main-content" tabindex="-1">{% block content %}{% endblock %}</main>
  </div>
  <div id="toastRegion" class="toast-region" role="status" aria-live="polite"></div>
</body>
</html>
